<div class="breadcrumb d-flex align-items-center" [ngClass]="class">
  <div *ngFor="let item of breadcrumbs; let i = index" class="breadcrumb-item">
    <span *ngIf="item.link" class="hover-text-primary cursor-pointer" [routerLink]="item.link">{{item.title}}</span>
    <span *ngIf="!item.link">{{item.title}}</span>
  </div>
</div>
