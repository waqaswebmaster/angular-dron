<div class="d-flex align-items-center cursor-pointer" [routerLink]="['/users', user.id]">
  <div *ngIf="user.photo_url" class="avatar events-none"
       [style.background-image]="'url(' + user.photo_url + ')'">
  </div>

  <i *ngIf="!user.photo_url" class="fa fa-user-circle text-3xl"></i>
  &nbsp;&nbsp;<span class="text-primary">{{user.full_name}}</span>
</div>
