<div class="smartlink-profile-tab py-2">
  <form class="form-horizontal mt-3" [formGroup]="form">
    <div *ngIf="smartLink" class="form-group row align-items-center">
      <label class="label col-sm-3 mb-0">UUID</label>
      <span class="col-sm-9 p-0">{{smartLink.uuid_link}}</span>
    </div>

    <div class="form-group row align-items-center">
      <label class="label col-sm-3 mb-0">Name</label>
      <input class="col-sm-9" fullWidth nbInput formControlName="name" placeholder="Name"
             [status]="isFieldInvalid(f.name) ? 'danger' : 'basic'" shape="rectangle">
      <div class="col-sm-3"></div>
      <div *ngIf="isFieldInvalid(f.name)" class="invalid-feedback col-sm-9 d-block pl-1">
        <div *ngIf="f.name.errors.required">Name is required</div>
      </div>
    </div>

    <div class="form-group row align-items-center">
      <label class="label col-sm-3 mb-0">Owner</label>
      <app-user-autocomplete class="col-sm-9 p-0"
                             [value]="f.owner.value"
                             [invalid]="isFieldInvalid(f.owner)"
                             (valueChange)="onFieldChange(f.owner, $event)"></app-user-autocomplete>
      <div class="col-sm-3"></div>
      <div *ngIf="isFieldInvalid(f.owner)" class="invalid-feedback col-sm-9 d-block pl-1">
        <div *ngIf="f.owner.errors.required">Owner is required</div>
      </div>
    </div>

    <div class="row justify-content-end">
      <button nbButton shape="rectangle" status="primary" size="small" (click)="onSave()">Save Changes</button>
    </div>
  </form>
</div>
