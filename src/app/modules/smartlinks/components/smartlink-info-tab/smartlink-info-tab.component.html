<div class="smartlink-info-tab py-2">
  <div class="row">
    <div class="col-md-6">
      <div class="info d-flex">
        <span>IP Address:</span>&nbsp;
        <b>{{smartLink.ip_address || 'NONE'}}</b>
      </div>
      <div class="info d-flex">
        <span>Port:</span>&nbsp;
        <b>{{smartLink.port || 'NONE'}}</b>
      </div>
      <div class="info d-flex">
        <span>Software:</span>&nbsp;
        <b>{{smartLink.software || 'NONE'}}</b>
      </div>
    </div>

    <div class="col-md-6">
      <div class="info d-flex">
        <span>Owner:</span>&nbsp;
        <b *ngIf="smartLink.owner" class="text-primary cursor-pointer" [routerLink]="['/users', smartLink.owner.id]">{{smartLink.owner.full_name}}</b>
      </div>
      <div class="info d-flex">
        <span>Users:</span>
        <span *ngFor="let user of smartLink.users; let i = index">
          {{ i> 0 ? ',' : '' }}&nbsp;
          <b class="text-primary cursor-pointer" [routerLink]="['/users', user.id]">{{user.full_name}}</b>
        </span>
      </div>
    </div>
  </div>
</div>
