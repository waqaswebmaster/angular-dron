<div class="account-detail-page">
  <app-breadcrumb [breadcrumbs]="breadcrumbs" class="mb-3"></app-breadcrumb>

  <nb-card>
    <div class="row p-3">
      <div class="col-md-4 mb-3">
        <app-avatar-editor [avatar]="account.photo"></app-avatar-editor>
      </div>
      <div class="col-md-8 mb-3">
        <nb-tabset>
          <nb-tab tabTitle="Profile">
            <app-user-profile-tab [user]="account"></app-user-profile-tab>
          </nb-tab>
          <nb-tab tabTitle="Activity">
            <app-user-activities-tab [user]="account"></app-user-activities-tab>
          </nb-tab>
          <nb-tab tabTitle="Edit">
            <app-user-edit-tab [user]="account"></app-user-edit-tab>
          </nb-tab>
          <nb-tab tabTitle="Billing">
            <app-user-billing-tab [user]="account"></app-user-billing-tab>
          </nb-tab>
          <nb-tab tabTitle="Features">
            <app-user-features-tab [user]="account"></app-user-features-tab>
          </nb-tab>
        </nb-tabset>
      </div>
    </div>
  </nb-card>

</div>
