<div class="Features-page h-100">
  <div class="page-header d-flex align-items-center justify-content-between mb-3">
    <app-breadcrumb [breadcrumbs]="breadcrumbs"></app-breadcrumb>
    <button nbButton status="primary" size="small" routerLink="/features/create"><i class="fa fa-plus mr-1"></i> Create new features</button>
  </div>

  <div class="nb-table bg-theme-primary table-sm nowrap shadow">
    <table mat-table [dataSource]="dataSource" matSort class="w-100" (matSortChange)="onSortChange($event)">

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
        <td mat-cell *matCellDef="let item">
          <span class="text-primary">{{item.name}}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="service_name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Service name</th>
        <td mat-cell *matCellDef="let item">{{item.service_name}}</td>
      </ng-container>

      <ng-container matColumnDef="trial_period">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Trial period (in Hours)</th>
        <td mat-cell *matCellDef="let item">{{item.trial_period}}</td>
      </ng-container>

      <ng-container matColumnDef="monthly_fee">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Monthly fee (in Cents)</th>
        <td mat-cell *matCellDef="let item">{{item.monthly_fee}}</td>
      </ng-container>

      <ng-container matColumnDef="yearly_fee">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Yearly fee (in Cents)</th>
        <td mat-cell *matCellDef="let item">{{item.yearly_fee}}</td>
      </ng-container>

      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>Action</th>
        <td mat-cell *matCellDef="let item">
          <button nbButton status="danger" size="small" (click)="onDeactive(item, dialog)">Deactive</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <app-paginator [(page)]="page" [pageSize]="10" [length]="totalCount" (pageChange)="loadTableData()"></app-paginator>
  </div>
</div>

<ng-template #dialog let-data let-ref="dialogRef">
  <nb-card>
    <nb-card-header>Deactive feature</nb-card-header>
    <nb-card-body>
      You are going to deactive feature <b>{{data.name}}</b>
    </nb-card-body>
    <nb-card-footer class="d-flex justify-content-between">
      <button nbButton size="small" (click)="ref.close(false)">Close</button>
      <button nbButton size="small" status="danger" (click)="ref.close(true)">Deactive</button>
    </nb-card-footer>
  </nb-card>
</ng-template>
